# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Selenized Black
include current-theme.conf
# END_KITTY_THEME

copy_on_select no
focus_follows_mouse no
sync_to_monitor no










# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font" style=Regular
font_size        12
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

background_opacity 0.85
background_blur 1
dim_opacity 0.3
