# Location: ~/.config/starship.toml
# https://starship.rs/

add_newline = true
command_timeout = 2000
palette = "catppuccin_mocha"

format = """
$directory\
$git_branch\
$nix_shell\
$python\
$line_break\
$character"""

[character]
success_symbol = "[>](green)"
error_symbol = "[ Ψ\\(`_´ # \\)↝ ](red)"
vimcmd_symbol = "[󰄛 ❮](subtext1)"

[directory]
format = '[$path]($style)'
style = "bold green"

[git_branch]
format = "  [ $branch]($style)"
style = "yellow"

[git_status]
format = "[[( [::](dimmed) $conflicted$untracked$modified$staged$renamed$deleted)](blue) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = " "
untracked = "󰰨 "
modified = "󰯲 "
staged = "󰰢 "
renamed = "󰰟 "
deleted = "󰯵 "
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[(   󱎫  took $duration\n)]($style)"
style = "dimmed"

[python]
format = '[$virtualenv]($style) '
style = "bright-black"

[nix_shell]
format = ' [$symbol$state( \($name\))]($style) '
symbol = " "
style = "dimmed purple"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
cyan = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
purple = "#cba6f7"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
